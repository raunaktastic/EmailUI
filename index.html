<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espotz Email Previews</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4f3f8;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #111;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    a.btn {
      display: block;
      padding: 16px 24px;
      background-color: #5B2EF7;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    a.btn:hover {
      background-color: #4920d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Espotz Email Previews</h1>
    <p style="color: #666; margin-bottom: 30px;">Select an email design to preview:</p>
    <div class="links">
      <a href="preview_ui1.html" class="btn">Preview 1 (Full Banner - Activated)</a>
      <a href="preview_deactivated.html" class="btn" style="background-color: #ef4444;">Preview 1 (Full Banner - Deactivated)</a>
      <a href="preview_deleted.html" class="btn" style="background-color: #b91c1c;">Preview 1 (Full Banner - Deleted)</a>
      <a href="preview_left.html" class="btn" style="background-color: #ea580c;">Preview 1 (Full Banner - Left)</a>
    </div>
  </div>
</body>
</html>
